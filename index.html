async function seedDefaults() {
    showNotification('数据库为空，正在初始化...', '');
    const rows = DEFAULT_CHEMICALS.map(c => ({ name: c.name, stock: c.stock, location: c.location, description: c.desc || '' }));
    const { data, error } = await sb.from(TABLE).insert(rows).select();
    if (error) { showNotification('初始化失败: ' + error.message, 'error'); return []; }
    showNotification('已初始化 ' + data.length + ' 条数据', 'success');
    return data;
}

async function dbInsert(row) {
    const { data, error } = await sb.from(TABLE).insert({ name: row.name, stock: row.stock, location: row.location, description: row.desc || '' }).select().single();
    if (error) throw error;
    return data;
}

async function dbUpdate(id, updates) {
    const { data, error } = await sb.from(TABLE).update(updates).eq('id', id).select().single();
    if (error) throw error;
    return data;
}

async function dbDelete(id) {
    const { error } = await sb.from(TABLE).delete().eq('id', id);
    if (error) throw error;
}

// 企业微信通知
async function sendWechatNotify(content) {
    if (!WECHAT_WEBHOOK || WECHAT_WEBHOOK.includes('YOUR_KEY_HERE')) return;
    try {
        await fetch(WECHAT_WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ msgtype: 'text', text: { content: content } })
        });
    } catch (e) { console.warn('微信通知发送失败:', e); }
}

async function initApp() {
    const loader = document.getElementById('loadingOverlay');
    try {
        let data = await loadAll();
        if (data === null) { loader.classList.add('hidden'); return; }
        if (data.length === 0) data = await seedDefaults();
        chemicals = data.map(r => ({ id: r.id, name: r.name, stock: r.stock, location: r.location, desc: r.description || '' }));
        updateLocationFilter();
        renderTable();
        setTimeout(checkAlerts, 800);
    } catch (e) {
        showNotification('初始化异常: ' + e.message, 'error');
    } finally {
        loader.classList.add('hidden');
    }
}

function renderTable() {
    const search = document.getElementById('searchInput').value.trim().toLowerCase();
    const locFilter = document.getElementById('locationFilter').value;
    let filtered = chemicals.filter(c => {
        if (search && !c.name.toLowerCase().includes(search) && !c.location.toLowerCase().includes(search)) return false;
        if (locFilter && c.location !== locFilter) return false;
        return true;
    });
    document.getElementById('totalCount').textContent = chemicals.length;
    const totalStock = chemicals.reduce((sum, c) => sum + (c.stock || 0), 0);
    document.getElementById('totalStock').textContent = totalStock;
    document.getElementById('alertCount').textContent = chemicals.filter(c => c.stock <= 2).length;
    const tbody = document.getElementById('tableBody');
    if (filtered.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#999;">🔎 没有找到匹配的药剂</td></tr>'; return; }
    let html = '';
    filtered.forEach(c => {
        const isLow = c.stock <= 2;
        let badge = c.stock === 0 ? '<span class="badge badge-empty">缺货</span>' : isLow ? '<span class="badge badge-low">低库存</span>' : '<span class="badge badge-normal">正常</span>';
        let dn = c.name, dl = c.location;
        if (search) { const re = new RegExp('(' + search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'); dn = dn.replace(re, '<span class="search-highlight">$1</span>'); dl = dl.replace(re, '<span class="search-highlight">$1</span>'); }
        html += '<tr class="' + (isLow ? 'low-stock' : '') + '" ondblclick="showDetail(' + c.id + ')"><td><strong>' + dn + '</strong></td><td>' + c.stock + '</td><td>' + dl + '</td><td>' + badge + '</td><td style="max-width:180px;font-size:13px;color:#555;">' + (c.desc || '—') + '</td><td><div class="action-btns"><button class="btn btn-success" style="padding:4px 12px;font-size:12px;" onclick="event.stopPropagation();quickAction(' + c.id + ',\'in\')">+入库</button><button class="btn btn-warning" style="padding:4px 12px;font-size:12px;" onclick="event.stopPropagation();quickAction(' + c.id + ',\'out\')">-出库</button><button class="btn btn-outline" style="padding:4px 12px;font-size:12px;" onclick="event.stopPropagation();editChemical(' + c.id + ')">✎编辑</button><button class="btn btn-danger" style="padding:4px 12px;font-size:12px;" onclick="event.stopPropagation();deleteChemical(' + c.id + ')">🗑删除</button></div></td></tr>';
    });
    tbody.innerHTML = html;
}

function updateLocationFilter() {
    const sel = document.getElementById('locationFilter');
    const v = sel.value;
    const locs = [...new Set(chemicals.map(c => c.location).filter(Boolean))].sort();
    sel.innerHTML = '<option value="">全部位置</option>' + locs.map(l => '<option value="' + l + '">' + l + '</option>').join('');
    sel.value = v || '';
}

let modalMode = '', editTargetId = null;

function openModal(mode, targetId) {
    modalMode = mode; editTargetId = targetId || null;
    const overlay = document.getElementById('modalOverlay');
    const title = document.getElementById('modalTitle');
    const form = document.getElementById('modalForm');
    if (mode === 'add') {
        title.textContent = '➕ 新增药剂';
        form.innerHTML = '<div class="form-group"><label>药剂名称 *</label><input type="text" id="mName" placeholder="如：硫酸铜"></div><div class="form-row"><div class="form-group"><label>库存数量</label><input type="number" id="mStock" value="1" min="0"></div><div class="form-group"><label>存放位置 *</label><input type="text" id="mLocation" placeholder="如：化验室A柜"></div></div><div class="form-group"><label>药剂作用/描述</label><textarea id="mDesc" placeholder="可选填写主要用途..."></textarea></div>';
    } else if (mode === 'in' || mode === 'out') {
        title.textContent = mode === 'in' ? '📥 入库操作' : ' 出库操作';
        form.innerHTML = '<div class="form-group"><label>选择药剂 *</label><select id="mChemSelect">' + chemicals.map(c => '<option value="' + c.id + '">' + c.name + ' (当前库存: ' + c.stock + ')</option>').join('') + '</select></div><div class="form-group"><label>数量 *</label><input type="number" id="mQty" value="1" min="1"></div>' + (mode === 'out' ? '<p style="color:#c0392b;font-size:13px;">⚠️ 出库数量不能超过当前库存</p>' : '');
    } else if (mode === 'edit') {
        const c = chemicals.find(x => x.id === targetId); if (!c) return;
        title.textContent = ' 编辑药剂 - ' + c.name;
        form.innerHTML = '<div class="form-group"><label>药剂名称 *</label><input type="text" id="mName" value="' + c.name + '"></div><div class="form-row"><div class="form-group"><label>库存数量</label><input type="number" id="mStock" value="' + c.stock + '" min="0"></div><div class="form-group"><label>存放位置 *</label><input type="text" id="mLocation" value="' + c.location + '"></div></div><div class="form-group"><label>药剂作用/描述</label><textarea id="mDesc">' + (c.desc || '') + '</textarea></div>';
    }
    overlay.classList.add('active');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); modalMode = ''; editTargetId = null; }

async function confirmModal() {
    const btn = document.getElementById('modalConfirmBtn'); btn.disabled = true; btn.textContent = '处理中...';
    try {
        if (modalMode === 'add') {
            const name = document.getElementById('mName').value.trim(), stock = parseInt(document.getElementById('mStock').value) || 0, location = document.getElementById('mLocation').value.trim(), desc = document.getElementById('mDesc').value.trim();
            if (!name || !location) { showNotification('请填写药剂名称和存放位置！', 'error'); return; }
            if (chemicals.some(c => c.name === name)) { showNotification('该药剂已存在，请使用入库功能增加库存！', 'warn'); return; }
            const nr = await dbInsert({ name, stock, location, desc });
            chemicals.push({ id: nr.id, name: nr.name, stock: nr.stock, location: nr.location, desc: nr.description || '' });
            updateLocationFilter(); renderTable(); showNotification('✅ 成功添加药剂「' + name + '」', 'success');
            sendWechatNotify('【新增药剂】\n名称：' + name + '\n库存：' + stock + '\n位置：' + location + '\n描述：' + (desc || '无') + '\n操作人：系统\n时间：' + new Date().toLocaleString('zh-CN'));
            closeModal();
        } else if (modalMode === 'in' || modalMode === 'out') {
            const chemId = parseInt(document.getElementById('mChemSelect').value), qty = parseInt(document.getElementById('mQty').value) || 0, c = chemicals.find(x => x.id === chemId);
            if (!c) return; if (qty <= 0) { showNotification('请输入有效数量！', 'error'); return; }
            if (modalMode === 'in') { const ns = c.stock + qty; await dbUpdate(c.id, { stock: ns }); c.stock = ns; showNotification('📥 ' + c.name + ' 入库 ' + qty + ' 件，当前库存 ' + c.stock, 'success'); sendWechatNotify('【入库】\n药剂：' + c.name + '\n入库数量：+' + qty + '\n当前库存：' + c.stock + '\n存放位置：' + c.location + '\n时间：' + new Date().toLocaleString('zh-CN')); }
            else { if (qty > c.stock) { showNotification('❌ 出库失败：' + c.name + ' 当前库存仅 ' + c.stock + '，不足 ' + qty, 'error'); return; } const ns = c.stock - qty; await dbUpdate(c.id, { stock: ns }); c.stock = ns; showNotification(' ' + c.name + ' 出库 ' + qty + ' 件，当前库存 ' + c.stock, 'success'); sendWechatNotify('【出库】\n药剂：' + c.name + '\n出库数量：-' + qty + '\n当前库存：' + c.stock + (c.stock <= 2 ? '\n⚠️ 库存预警！请及时补充！' : '') + '\n存放位置：' + c.location + '\n时间：' + new Date().toLocaleString('zh-CN')); }
            renderTable(); closeModal(); checkAlerts();
        } else if (modalMode === 'edit') {
            const name = document.getElementById('mName').value.trim(), stock = parseInt(document.getElementById('mStock').value) || 0, location = document.getElementById('mLocation').value.trim(), desc = document.getElementById('mDesc').value.trim();
            if (!name || !location) { showNotification('请填写药剂名称和存放位置！', 'error'); return; }
            const c = chemicals.find(x => x.id === editTargetId); if (!c) return;
            if (chemicals.some(x => x.name === name && x.id !== editTargetId)) { showNotification('该名称已被其他药剂使用！', 'error'); return; }
            await dbUpdate(c.id, { name, stock, location, description: desc });
            c.name = name; c.stock = stock; c.location = location; c.desc = desc;
            updateLocationFilter(); renderTable(); showNotification('✅ 已更新「' + name + '」的信息', 'success');
            sendWechatNotify('【编辑药剂】\n名称：' + name + '\n库存：' + stock + '\n位置：' + location + '\n描述：' + (desc || '无') + '\n时间：' + new Date().toLocaleString('zh-CN'));
            closeModal();
        }
    } catch (e) { showNotification('操作失败: ' + e.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = '确认'; }
}

function quickAction(id, mode) { openModal(mode, id); if (mode === 'in' || mode === 'out') setTimeout(() => { const s = document.getElementById('mChemSelect'); if (s) s.value = id; }, 50); }
function editChemical(id) { openModal('edit', id); }

async function deleteChemical(id) {
    const c = chemicals.find(x => x.id === id); if (!c) return;
    if (!confirm('确定要删除药剂「' + c.name + '」吗？此操作不可撤销！')) return;
    try { await dbDelete(id); chemicals = chemicals.filter(x => x.id !== id); updateLocationFilter(); renderTable(); showNotification('🗑 已删除「' + c.name + '」', 'success'); sendWechatNotify('【删除药剂】\n名称：' + c.name + '\n原库存：' + c.stock + '\n原位置：' + c.location + '\n时间：' + new Date().toLocaleString('zh-CN')); }
    catch (e) { showNotification('删除失败: ' + e.message, 'error'); }
}

function showDetail(id) { const c = chemicals.find(x => x.id === id); if (!c) return; showNotification('📋 ' + c.name + ' | 库存: ' + c.stock + ' | 位置: ' + c.location + ' | 作用: ' + (c.desc || '未填写'), ''); }

function showNotification(msg, type) {
    const area = document.getElementById('notificationArea'), div = document.createElement('div');
    div.className = 'notification ' + (type || ''); div.textContent = msg; area.appendChild(div);
    setTimeout(() => { div.style.opacity = '0'; div.style.transform = 'translateX(80px)'; div.style.transition = '0.4s'; setTimeout(() => div.remove(), 400); }, 3500);
}

function checkAlerts() {
    const low = chemicals.filter(c => c.stock <= 2);
    if (low.length === 0) return;
    let msg = '【库存预警】共 ' + low.length + ' 种药剂需要关注：\n\n';
    low.forEach(c => {
        const tag = c.stock === 0 ? '缺货' : '低库存';
        msg += tag + ' ' + c.name + ' | 剩余: ' + c.stock + ' | 位置: ' + c.location + '\n';
    });
    msg += '\n请及时补充！时间：' + new Date().toLocaleString('zh-CN');
    sendWechatNotify(msg);
    low.forEach(c => { showNotification(c.stock === 0 ? ' 缺货警报：' + c.name + ' 已用完，请及时补充！' : ' 低库存：' + c.name + ' 仅剩 ' + c.stock + ' 件（位置：' + c.location + '）', c.stock === 0 ? 'error' : 'warn'); });
}
function resetAllFilters() { document.getElementById('searchInput').value = ''; document.getElementById('locationFilter').value = ''; renderTable(); }

window.exportData = function() { const b = new Blob([JSON.stringify(chemicals, null, 2)], {type:'application/json'}), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = '药剂数据备份.json'; a.click(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === this) closeModal(); });

initApp();
</script>
